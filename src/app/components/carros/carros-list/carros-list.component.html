<div class="container mt-3">
    <div class="row">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-body">
                    <h3>Listagem de carros</h3>
                    <div class="direita">
                        <button type="button" class="btn btn-primary" routerLink="/admin/carros/new">Novo</button>
                    </div>
                    <br>
                    <table border="1" class="table table-striped">
                        <thead>
                            <tr>
                            <th scope="col">ID</th>
                            <th scope="col">Nome</th>
                            <th scope="col">Marca</th>
                            <th scope="col" class="direita">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            @for (carro of lista; track carro.id) {
                            <tr>
                                <td>{{carro.id}}</td>
                                <td>{{carro.marca}}</td>
                                <td>{{carro.modelo}}</td>
                                <td class="direita">
                                     <button type="button" class="btn btn-warning me-1" [routerLink]="['/admin/carros/edit', carro.id]">Editar</button>
                                     <button type="button" class="btn btn-danger" (click)="deletar(carro)">Excluir</button>
                                </td>
                            </tr>
                        }
                        </tbody>
                    </table>

                </div>
            </div>
        </div>
    </div>
</div>
