<div class="container mt-3">
    <div class="row">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-body">
                    <h3>Listagem de marcas</h3>
                    <div class="direita">
                        <button type="button" class="btn btn-primary" (click)="novaMarca()">Novo</button>
                    </div>
                    <br>
                    <table border="1" class="table table-striped">
                        <thead>
                            <tr>
                                <th scope="col">ID</th>
                                <th scope="col">Nome</th>
                                <th scope="col" class="direita">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            @for (marca of lista; track marca.id) {
                                <tr>
                                    <td>{{ marca.id }}</td>
                                    <td>{{ marca.nome }}</td>
                                    <td class="direita">
                                        <button type="button" class="btn btn-warning me-1" (click)="editarMarca(marca)">Editar</button>
                                        <button type="button" class="btn btn-danger" (click)="deletar(marca)">Excluir</button>
                                    </td>
                                </tr>
                            }
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<ng-template #modalMarcaDetails>
    <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Marcas</h5>
        <button type="button" class="btn-close" aria-label="Close" (click)="modalRef.close()"></button>
    </div>
    <div class="modal-body">
        <app-marca-details
            [marca]="marcaEdit"
            (retorno)="retornoDetalhe($event)">
        </app-marca-details>
    </div>
</ng-template>
