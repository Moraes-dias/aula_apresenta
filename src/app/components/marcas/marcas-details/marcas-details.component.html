<div class="container mt-3">
    <div class="row">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-body">
                    <h3>Cadastrar nova marca</h3>
                    <br>

                    <mdb-form-control>
                        <input
                            mdbInput
                            type="text"
                            id="marca"
                            class="form-control mb-3"
                            [(ngModel)]='marca.nome'
                            placeholder="Marca"
                        />
                        <label mdbLabel class="form-label" for="marca">Marca</label>
                    </mdb-form-control>

                    <br>

                    <button type="button" class="btn btn-primary" (click)="salvar()">Salvar</button>

                </div>
            </div>
        </div>
    </div>
</div>
